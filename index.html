<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSS + PVT-b Experiment</title>
    
    <!-- jsPsych -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; color: #333; }

        .fullscreen-start { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .start-content { text-align: center; background: white; padding: 60px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); max-width: 600px; }
        .start-content h1 { color: #667eea; margin-bottom: 20px; font-size: 2em; }
        .start-content p { margin-bottom: 20px; font-size: 1.1em; line-height: 1.6; }
        .start-button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 40px; font-size: 1.2em; border-radius: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin: 20px 0; }
        .start-button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .small-text { font-size: 0.9em; color: #666; }

        #jspsych-target { min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .jspsych-display-element { display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100%; }

        .screen-wrap { display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100%; padding: 40px; }
        .instr { max-width: 800px; text-align: center; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1); }
        .instr h1, .instr h2 { color: #667eea; margin-bottom: 20px; }
        .instr p { font-size: 1.2em; line-height: 1.8; margin-bottom: 15px; }
        .small-note { margin-top: 30px; font-size: 0.9em; color: #666; font-style: italic; }

        .kss-container { max-width: 900px; width: 100%; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1); }
        .kss-title { text-align: center; color: #667eea; font-size: 2em; margin-bottom: 30px; }
        .kss-description { text-align: center; font-size: 1.1em; margin-bottom: 40px; color: #555; }
        .kss-options { display: flex; flex-direction: column; gap: 15px; }
        .kss-option { display: flex; align-items: center; padding: 20px; border: 2px solid #e0e0e0; border-radius: 10px; cursor: pointer; transition: all 0.3s; background: #fafafa; }
        .kss-option:hover { border-color: #667eea; background: #f0f4ff; transform: translateX(5px); }
        .kss-option.selected { border-color: #667eea; background: #e8eeff; }
        .kss-number { font-size: 2em; font-weight: bold; color: #667eea; min-width: 60px; text-align: center; }
        .kss-text { font-size: 1.1em; line-height: 1.5; flex: 1; }

        .pvt-screen { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #000; color: #fff; position: relative; }
        .pvt-stimulus { font-size: 8em; font-weight: bold; color: #fff; font-family: 'Courier New', monospace; }
        .pvt-fixation { font-size: 3em; color: #fff; }

        .feedback-good { font-size: 2em; color: #4CAF50; font-weight: bold; }
        .feedback-slow { font-size: 2em; color: #FF9800; font-weight: bold; }

        .finish-screen { text-align: center; background: white; padding: 60px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); max-width: 700px; }
        .finish-screen h1 { color: #667eea; margin-bottom: 30px; font-size: 2.5em; }
        .finish-screen p { font-size: 1.3em; line-height: 1.8; margin-bottom: 20px; }
    </style>
</head>
<body>
    <!-- Стартовый экран -->
    <div id="fullscreen-start" class="fullscreen-start">
        <div class="start-content">
            <h1>Эксперимент</h1>
            <p>Для корректной работы эксперимента рекомендуется полный экран.</p>
            <button id="start-fullscreen-btn" class="start-button">Начать в полном экране</button>
            <p class="small-text">Или нажмите F11 для полного экрана вручную</p>
        </div>
    </div>
    
    <!-- Контейнер для jsPsych -->
    <div id="jspsych-target"></div>
    
    <!-- Скрипт эксперимента -->
    <script>
        console.log('=== EXPERIMENT SCRIPT STARTED ===');

        /* =========================
        КОНФИГУРАЦИЯ
        ========================= */
        const CONFIG = {
            pvt_duration_ms: 180000,  // 3 минуты
            pvt_min_isi: 0,           // 0 секунд
            pvt_max_isi: 4000,        // 4 секунды
            pvt_stimulus_duration: 1000,
            pvt_fixation_duration: 500,
            training_trials: 5,
        };

        /* =========================
        ИНИЦИАЛИЗАЦИЯ JSPSYCH
        ========================= */
        const jsPsych = initJsPsych({
            display_element: "jspsych-target",
            on_finish: function() {
                console.log('=== EXPERIMENT FINISHED ===');
                saveData();
                jsPsych.data.displayData();
            },
        });

        console.log('jsPsych initialized:', typeof jsPsych);

        /* =========================
        KSS ШКАЛА СОНЛИВОСТИ
        ========================= */
        const KSS_OPTIONS = [
            { value: 1, text: "Крайне бодр" },
            { value: 2, text: "Очень бодр" },
            { value: 3, text: "Бодр" },
            { value: 4, text: "Довольно бодр" },
            { value: 5, text: "Ни бодр, ни сонный" },
            { value: 6, text: "Некоторые признаки сонливости" },
            { value: 7, text: "Сонный, но никаких усилий для поддержания бодрствования не требуется" },
            { value: 8, text: "Сонный, некоторое усилие требуется, чтобы оставаться в сознании" },
            { value: 9, text: "Очень сонный, требуется большое усилие, чтобы не уснуть, борьба со сном" }
        ];

        /* =========================
        ПЕРЕМЕННЫЕ ДЛЯ PVT
        ========================= */
        let pvtEndTime = 0;
        let pvtTrialCount = 0;
        let trainingTrialCount = 0;

        /* =========================
        ФУНКЦИЯ СОХРАНЕНИЯ ДАННЫХ
        ========================= */
        function saveData() {
            console.log('saveData called');
            try {
                const data = jsPsych.data.get().csv();
                const filename = `KSS_PVT_${window.PARTICIPANT_ID || 'unknown'}_${Date.now()}.csv`;
                const blob = new Blob([data], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
                URL.revokeObjectURL(link.href);
                console.log('Data saved:', filename);
            } catch (err) {
                console.error('saveData error:', err);
            }
        }

        /* =========================
        ФУНКЦИЯ ДЛЯ ВЫБОРА KSS
        ========================= */
        function selectKSSOption(element, value) {
            console.log('KSS selected:', value);
            document.querySelectorAll('.kss-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            window.kssResponse = value;
            setTimeout(() => {
                jsPsych.finishTrial();
            }, 500);
        }

        /* =========================
        ДОБАВЛЕНИЕ ТРЕНИРОВОЧНОГО PVT ТРИАЛА
        ========================= */
        function addTrainingPVTTrial() {
            trainingTrialCount++;
            console.log('Training PVT trial:', trainingTrialCount);
            
            if (trainingTrialCount > CONFIG.training_trials) {
                console.log('Training complete');
                addMainPVTInstruction();
                return;
            }
            
            const isi = CONFIG.pvt_min_isi + Math.random() * (CONFIG.pvt_max_isi - CONFIG.pvt_min_isi);
            
            jsPsych.addNodeToEndOfTimeline({
                timeline: [
                    {
                        type: jsPsychHtmlKeyboardResponse,
                        stimulus: `<div class="pvt-screen"><div class="pvt-fixation">+</div></div>`,
                        choices: "NO_KEYS",
                        trial_duration: CONFIG.pvt_fixation_duration,
                    },
                    {
                        type: jsPsychHtmlKeyboardResponse,
                        stimulus: `<div class="pvt-screen"></div>`,
                        choices: "NO_KEYS",
                        trial_duration: isi,
                    },
                    {
                        type: jsPsychHtmlKeyboardResponse,
                        stimulus: `<div class="pvt-screen"><div class="pvt-stimulus">0</div></div>`,
                        choices: [" "],
                        trial_duration: CONFIG.pvt_stimulus_duration,
                        data: { 
                            trial_type: 'pvt_training',
                            training_trial_number: trainingTrialCount,
                            participant_id: window.PARTICIPANT_ID,
                        },
                        on_finish: function(data) {
                            if (data.response === null) {
                                data.reaction_time = null;
                                data.timeout = 1;
                            } else {
                                data.reaction_time = data.rt;
                                data.timeout = 0;
                            }
                        },
                    },
                    {
                        type: jsPsychHtmlKeyboardResponse,
                        stimulus: function() {
                            const last = jsPsych.data.get().last(1).values()[0];
                            if (last.timeout) {
                                return `<div class="screen-wrap"><div class="feedback-slow">Не реагировали! Попробуйте быстрее.</div></div>`;
                            } else {
                                return `<div class="screen-wrap"><div class="feedback-good">Время реакции: ${last.reaction_time} мс</div></div>`;
                            }
                        },
                        choices: "NO_KEYS",
                        trial_duration: 1500,
                        on_finish: function() {
                            addTrainingPVTTrial();
                        },
                    }
                ]
            });
        }

        /* =========================
        ДОБАВЛЕНИЕ ИНСТРУКЦИИ К ОСНОВНОЙ PVT
        ========================= */
        function addMainPVTInstruction() {
            console.log('Adding main PVT instruction');
            jsPsych.addNodeToEndOfTimeline({
                timeline: [
                    {
                        type: jsPsychHtmlKeyboardResponse,
                        stimulus: `<div class="screen-wrap">
                            <div class="instr">
                                <h1>Основной тест на внимание</h1>
                                <p>Тренировка завершена!</p>
                                <p>Теперь начинается основной тест.</p>
                                <p>На черном экране будут появляться числа.</p>
                                <p>Как только вы увидите число, нажмите <strong>ПРОБЕЛ</strong> как можно быстрее.</p>
                                <p>Тест продлится <strong>3 минуты</strong>.</p>
                                <p>Обратной связи больше не будет.</p>
                                <p>Старайтесь реагировать быстро и точно.</p>
                                <div class="small-note">Нажмите любую клавишу, чтобы начать.</div>
                            </div>
                        </div>`,
                        choices: "ALL_KEYS",
                        on_finish: function() {
                            startMainPVT();
                        },
                    }
                ]
            });
        }

        /* =========================
        ЗАПУСК ОСНОВНОЙ PVT ЗАДАЧИ
        ========================= */
        function startMainPVT() {
            console.log('Main PVT started');
            pvtEndTime = Date.now() + CONFIG.pvt_duration_ms;
            pvtTrialCount = 0;
            addMainPVTTrial();
        }

        /* =========================
        ДОБАВЛЕНИЕ ОСНОВНОГО PVT ТРИАЛА
        ========================= */
        function addMainPVTTrial() {
            const currentTime = Date.now();
            if (currentTime >= pvtEndTime) {
                console.log('Main PVT finished');
                addFinishScreen();
                return;
            }
            
            const isi = CONFIG.pvt_min_isi + Math.random() * (CONFIG.pvt_max_isi - CONFIG.pvt_min_isi);
            
            jsPsych.addNodeToEndOfTimeline({
                timeline: [
                    {
                        type: jsPsychHtmlKeyboardResponse,
                        stimulus: `<div class="pvt-screen"></div>`,
                        choices: "NO_KEYS",
                        trial_duration: isi,
                    },
                    {
                        type: jsPsychHtmlKeyboardResponse,
                        stimulus: `<div class="pvt-screen"><div class="pvt-stimulus">0</div></div>`,
                        choices: [" "],
                        trial_duration: CONFIG.pvt_stimulus_duration,
                        data: { 
                            trial_type: 'pvt_main',
                            participant_id: window.PARTICIPANT_ID,
                        },
                        on_finish: function(data) {
                            pvtTrialCount++;
                            if (data.response === null) {
                                data.reaction_time = null;
                                data.timeout = 1;
                            } else {
                                data.reaction_time = data.rt;
                                data.timeout = 0;
                            }
                            data.trial_number = pvtTrialCount;
                            addMainPVTTrial();
                        },
                    }
                ]
            });
        }

        /* =========================
        ДОБАВЛЕНИЕ ФИНАЛЬНОГО ЭКРАНА
        ========================= */
        function addFinishScreen() {
            console.log('Adding finish screen');
            jsPsych.addNodeToEndOfTimeline({
                timeline: [
                    {
                        type: jsPsychHtmlKeyboardResponse,
                        stimulus: `<div class="screen-wrap">
                            <div class="finish-screen">
                                <h1>Эксперимент окончен</h1>
                                <p>Дождитесь выгрузки данных.</p>
                            </div>
                        </div>`,
                        choices: "ALL_KEYS",
                    }
                ]
            });
        }

        /* =========================
        ВВОД ID УЧАСТНИКА
        ========================= */
        const idTrial = {
            type: jsPsychSurveyHtmlForm,
            html: `<div style="display:flex; flex-direction:column; align-items:center; gap:20px; padding:40px;">
                <h2>Введите ID, который вам сообщил экспериментатор</h2>
                <input type="text" name="participant_id" required placeholder="id_1" 
                       style="font-size:24px; padding:10px 20px; border:2px solid #333; border-radius:8px; text-align:center; width:300px;">
            </div>`,
            button_label: "Начать",
            on_finish: function(data) {
                console.log('ID entered:', data.response.participant_id);
                window.PARTICIPANT_ID = data.response.participant_id;
                
                jsPsych.data.addProperties({
                    subject_id: window.PARTICIPANT_ID,
                    experiment_name: "KSS_PVT"
                });
                
                // Добавляем инструкцию KSS
                jsPsych.addNodeToEndOfTimeline({
                    timeline: [
                        {
                            type: jsPsychHtmlKeyboardResponse,
                            stimulus: `<div class="screen-wrap">
                                <div class="instr">
                                    <h1>Шкала сонливости</h1>
                                    <p>Сейчас вам будет предложена шкала сонливости.</p>
                                    <p>Пожалуйста, оцените ваше текущее состояние от 1 до 9.</p>
                                    <p>1 — вы крайне бодры, 9 — вы очень сонны.</p>
                                    <div class="small-note">Нажмите любую клавишу, чтобы продолжить.</div>
                                </div>
                            </div>`,
                            choices: "ALL_KEYS"
                        },
                        {
                            type: jsPsychHtmlKeyboardResponse,
                            stimulus: function() {
                                let html = `<div class="screen-wrap">
                                    <div class="kss-container">
                                        <h1 class="kss-title">Оцените вашу текущую сонливость</h1>
                                        <p class="kss-description">Выберите пункт, который лучше всего описывает ваше текущее состояние:</p>
                                        <div class="kss-options">`;
                                
                                KSS_OPTIONS.forEach(option => {
                                    html += `<div class="kss-option" data-value="${option.value}" onclick="selectKSSOption(this, ${option.value})">
                                        <div class="kss-number">${option.value}</div>
                                        <div class="kss-text">${option.text}</div>
                                    </div>`;
                                });
                                
                                html += `</div></div></div>`;
                                return html;
                            },
                            choices: "NO_KEYS",
                            trial_duration: 300000,
                            on_finish: function(data) {
                                if (!window.kssResponse) {
                                    alert("Пожалуйста, выберите вариант!");
                                    jsPsych.finishTrial();
                                    return;
                                }
                                data.kss_score = window.kssResponse;
                                console.log('KSS Score:', window.kssResponse);
                            }
                        },
                        {
                            type: jsPsychHtmlKeyboardResponse,
                            stimulus: `<div class="screen-wrap">
                                <div class="instr">
                                    <h1>Тренировка: Тест на внимание</h1>
                                    <p>Сейчас будет тренировка теста на внимание.</p>
                                    <p>На черном экране будет появляться число.</p>
                                    <p>Как только вы увидите число, нажмите <strong>ПРОБЕЛ</strong> как можно быстрее.</p>
                                    <p>Тренировка состоит из <strong>5 проб</strong>.</p>
                                    <p>После каждого ответа вы увидите обратную связь.</p>
                                    <div class="small-note">Нажмите любую клавишу, чтобы начать тренировку.</div>
                                </div>
                            </div>`,
                            choices: "ALL_KEYS",
                            on_finish: function() {
                                trainingTrialCount = 0;
                                addTrainingPVTTrial();
                            },
                        }
                    ]
                });
            }
        };

        /* =========================
        TIMELINE
        ========================= */
        const timeline = [idTrial];

        console.log('Timeline created:', timeline);

        /* =========================
        СТАРТ ЭКСПЕРИМЕНТА
        ========================= */
        function startExperiment() {
            console.log('startExperiment called');
            document.getElementById('fullscreen-start').style.display = 'none';
            try {
                jsPsych.run(timeline);
                console.log('jsPsych.run completed');
            } catch (err) {
                console.error('jsPsych.run error:', err);
            }
        }

        function enterFullscreen() {
            console.log('enterFullscreen called');
            const el = document.documentElement;
            const requestFullscreen = el.requestFullscreen || 
                                      el.webkitRequestFullscreen || 
                                      el.msRequestFullscreen;
            
            if (requestFullscreen) {
                requestFullscreen.call(el).then(() => {
                    console.log('Fullscreen entered');
                    startExperiment();
                }).catch((err) => {
                    console.warn('Fullscreen request failed:', err);
                    startExperiment();
                });
            } else {
                startExperiment();
            }
        }

        /* =========================
        ОБРАБОТЧИКИ СОБЫТИЙ
        ========================= */
        const startBtn = document.getElementById('start-fullscreen-btn');
        console.log('Start button found:', startBtn);
        
        if (startBtn) {
            startBtn.addEventListener('click', function() {
                console.log('Button clicked');
                enterFullscreen();
            });
            console.log('Button handler attached');
        } else {
            console.error('Start button not found!');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                const startScreen = document.getElementById('fullscreen-start');
                if (startScreen && startScreen.style.display !== 'none') {
                    console.log('Key pressed to start');
                    enterFullscreen();
                }
            }
        });

        console.log('=== EXPERIMENT SCRIPT COMPLETE ===');
    </script>
</body>
</html>
