<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSS + PVT-b Experiment</title>
    
    <!-- jsPsych -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    
    <!-- DataPipe Extension -->
    <script src="https://unpkg.com/@jspsych-contrib/extension-pipe@0.0.3"></script>
    
    <style>
        /* =========================
        ОБЩИЕ СТИЛИ
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* =========================
        СТАРТОВЫЙ ЭКРАН
        ========================= */
        .fullscreen-start {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .start-content {
            text-align: center;
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
        }

        .start-content h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .start-content p {
            margin-bottom: 20px;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 20px 0;
        }

        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .small-text {
            font-size: 0.9em;
            color: #666;
        }

        /* =========================
        JS PSYCH КОНТЕЙНЕР
        ========================= */
        #jspsych-target {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jspsych-display-element {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
        }

        /* =========================
        ИНСТРУКЦИИ
        ========================= */
        .screen-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 40px;
        }

        .instr {
            max-width: 800px;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .instr h1, .instr h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .instr p {
            font-size: 1.2em;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .small-note {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
            font-style: italic;
        }

        /* =========================
        KSS ШКАЛА
        ========================= */
        .kss-container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .kss-title {
            text-align: center;
            color: #667eea;
            font-size: 2em;
            margin-bottom: 30px;
        }

        .kss-description {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 40px;
            color: #555;
        }

        .kss-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .kss-option {
            display: flex;
            align-items: center;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }

        .kss-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(5px);
        }

        .kss-option.selected {
            border-color: #667eea;
            background: #e8eeff;
        }

        .kss-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            min-width: 60px;
            text-align: center;
        }

        .kss-text {
            font-size: 1.1em;
            line-height: 1.5;
            flex: 1;
        }

        /* =========================
        PVT ЗАДАЧА
        ========================= */
        .pvt-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
        }

        .pvt-stimulus {
            font-size: 8em;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .pvt-fixation {
            font-size: 3em;
            color: #fff;
        }

        .pvt-timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5em;
            color: #666;
        }

        /* =========================
        ОБРАТНАЯ СВЯЗЬ
        ========================= */
        .feedback-good {
            font-size: 2em;
            color: #4CAF50;
            font-weight: bold;
        }

        .feedback-slow {
            font-size: 2em;
            color: #FF9800;
            font-weight: bold;
        }

        /* =========================
        ФИНАЛЬНЫЙ ЭКРАН
        ========================= */
        .finish-screen {
            text-align: center;
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 700px;
        }

        .finish-screen h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .finish-screen p {
            font-size: 1.3em;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .data-info {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
            font-size: 0.9em;
            text-align: left;
        }

        .data-info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- Стартовый экран -->
    <div id="fullscreen-start" class="fullscreen-start">
        <div class="start-content">
            <h1>Эксперимент: Сонливость и внимание</h1>
            <p>Для корректной работы эксперимента рекомендуется полный экран.</p>
            <button id="start-fullscreen-btn" class="start-button">Начать в полном экране</button>
            <p class="small-text">Или нажмите F11 для полного экрана вручную</p>
        </div>
    </div>
    
    <!-- Контейнер для jsPsych -->
    <div id="jspsych-target"></div>
    
    <!-- Скрипт эксперимента -->
    <script src="kss-pvt-experiment.js"></script>
</body>
</html>
